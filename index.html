<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160a0b"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="Minecraft Dungeons save editor for the Android port and PC saves."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#160a0b}[hidden]{display:none!important}</style></head><body>
<title>MCDSaveEdit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the original MCDSaveEdit window, fitted to a landscape phone. Menu + tabs on one row, currency bar,
   then three scrolling columns: equipped gear + level hexagon | filtered item grid | selected item panel.
   Deliberately one light look, matching the original Windows app. */
:root {
  --win: #ffffff;
  --chrome: #f0f0f0;
  --line: #c8c8c8;
  --ink: #1a1a1a;
  --muted: #666b70;
  --title: #1f3a5a;
  --sel: #cde8ff;
  --sel-line: #4a9ee8;
  --common: #8a7a6b;
  --rare-a: #3cc9a0; --rare-b: #e6faf3;
  --uniq-a: #f08a1c; --uniq-b: #ffd84a;
  --purple: #7b3fd0; --purple-soft: #b892f2;
  --metal: #a3a8ad; --metal-dk: #6c7177; --metal-lt: #d9dcdf;
  --emerald: #19a34a; --gold: #d9a21b; --danger: #c62828;
  --ui: "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
  --num: "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--win); color: var(--ink); font-family: var(--ui); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel-line); outline-offset: 1px; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* menu + tabs row */
.menubar { display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--line); min-height: 34px; gap: 2px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.app .menubar { padding-left: 8px; padding-right: 8px; }
.menu { position: relative; }
.menu > button, .tabbtn { border: 0; background: transparent; padding: 0 10px; height: 100%; min-height: 34px; }
.menu > button:hover, .menu.open > button { background: var(--sel); }
.dropdown { position: absolute; top: 100%; left: 0; z-index: 30; background: var(--win); border: 1px solid #999; box-shadow: 2px 3px 8px rgb(0 0 0 / .2); min-width: 220px; padding: 3px 0; }
.dropdown button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 14px; }
.dropdown button:hover { background: var(--sel); }
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
.dropdown .kbd { color: var(--muted); font-size: 12px; }
.tabs { display: flex; margin-left: 10px; align-items: end; gap: 2px; }
.tabbtn { border: 1px solid transparent; border-bottom: 0; min-height: 30px; height: auto; align-self: end; border-radius: 3px 3px 0 0; color: var(--muted); }
.tabbtn[aria-selected=true] { background: var(--win); border-color: var(--line); color: var(--ink); position: relative; top: 1px; }
.fileinfo { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 40%; }
.fileinfo b { color: var(--ink); font-weight: 600; }
.savebtn { align-self: center; border: 1px solid var(--title); background: var(--title); color: #fff; padding: 4px 12px; border-radius: 3px; font-weight: 600; margin-left: 8px; }

/* currency bar */
.curbar { display: flex; align-items: center; gap: 14px; padding: 5px 10px; border-bottom: 1px solid #e6e6e6; flex-wrap: wrap; min-height: 40px; }
.cur { display: flex; align-items: center; gap: 6px; }
.cur input { width: 112px; border: 1px solid #aaa; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.cur .val { font-variant-numeric: tabular-nums; min-width: 36px; }
.cur .addcur { width: 112px; border: 1px solid #aaa; background: #e8e8e8; padding: 3px 6px; }
.curbar .spacer { flex: 1; }
.curbar .msg { font-size: 12px; color: var(--muted); max-width: 46ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ico { width: 22px; height: 22px; flex: none; }

/* three columns */
.pane { min-height: 0; }
.cols { height: 100%; display: grid; grid-template-columns: 172px minmax(0, 1fr) minmax(300px, 40%); min-height: 0; }
.col { min-height: 0; overflow: auto; padding: 8px; }
.col.left { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; align-content: start; border-right: 1px solid #eee; }
.col.mid { border-right: 1px solid #ddd; display: flex; flex-direction: column; gap: 8px; }
.col.right { display: flex; flex-direction: column; gap: 8px; }

/* item tiles */
.tile { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border: 3px solid var(--common); background: linear-gradient(160deg, #fafafa, #e7e7e7); padding: 0; display: grid; place-items: center; overflow: hidden; }
.tile.Rare { border-color: #b9c9c2; border-left-color: var(--rare-a); background: linear-gradient(90deg, var(--rare-a) 0, var(--rare-b) 22%, #fff 70%); }
.tile.Unique { border-color: var(--uniq-a); background: radial-gradient(circle at 50% 45%, var(--uniq-b), var(--uniq-a) 85%); }
.tile.sel { outline: 3px solid var(--sel-line); outline-offset: -1px; }
.tile svg.item { width: 70%; height: 70%; }
.tile .pow { position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
.tile .pts { position: absolute; left: 3px; top: 1px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 1px; text-shadow: 0 0 2px #fff; }
.tile .pts svg { width: 11px; height: 11px; }
.tile .newmark { position: absolute; right: 0; top: 0; width: 0; height: 0; border-top: 14px solid #ffd21f; border-left: 14px solid transparent; }
.tile .gildmark { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #c08a12, #ffe27a, #c08a12); }

.gear3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

.lvl .hex { position: absolute; inset: 0; }
.lvl .in { position: relative; display: grid; justify-items: center; gap: 2px; }

.stepper { display: flex; align-items: stretch; border: 1px solid #999; background: #fff; }

.stepper .sb button + button { border-top: 1px solid #ccc; }

.filters { display: flex; gap: 5px; flex-wrap: wrap; }
.filters button { width: 44px; height: 30px; border: 1px solid #aaa; background: linear-gradient(#fff, #e9e9e9); display: grid; place-items: center; padding: 0; }
.filters button[aria-pressed=true] { background: var(--sel); border-color: var(--sel-line); }
.filters svg { width: 22px; height: 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 5px; align-content: start; }
.count { margin-top: auto; text-align: center; font-size: 12px; color: var(--muted); padding-top: 4px; }

/* item panel (matches the original's right-hand panel) */
.ip { display: grid; gap: 7px; min-width: 0; }
.ip-top { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 4px 10px; align-items: start; }
.ip-top .left { display: grid; gap: 5px; min-width: 0; align-content: start; }
.ip-top .big { width: 88px; height: 88px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; grid-row: span 2; }
.ip-top .big:hover, .ip-top .big:focus-visible { background: var(--sel); }
.ip-top .big svg { width: 76px; height: 76px; }
.ip-top .big img { width: 86px; height: 86px; object-fit: contain; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.ip .row.checks { gap: 4px; }
.row.nowrap { flex-wrap: nowrap; }
.ip .stepper { flex: 1 1 0; min-width: 0; }
.ip .stepper input { width: 100%; min-width: 0; }
select.rar { border: 1px solid #aaa; padding: 3px 6px; background: #fff; flex: 1 1 0; min-width: 0; height: 30px; }
.chk { display: inline-flex; align-items: center; gap: 3px; border: 1px solid #aaa; background: linear-gradient(#fff, #ececec); padding: 1px 5px; font-size: 10.5px; text-transform: uppercase; cursor: pointer; user-select: none; white-space: nowrap; height: 24px; }
.chk.plain { text-transform: none; font-size: 12px; }
.chk input { width: 13px; height: 13px; margin: 0; }
.iname { font-size: 20px; font-weight: 400; margin: 0; overflow-wrap: anywhere; line-height: 1.2; }
.itype { font-size: 11px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.props { border: 1px solid #c9c9c9; max-height: 112px; overflow-y: auto; }
.prop { display: grid; grid-template-columns: 26px minmax(0, 1fr) 28px; align-items: stretch; border-bottom: 1px solid #c9c9c9; background: linear-gradient(#fff, #f2f2f2); min-height: 30px; }
.prop .rd { border: 0; background: transparent; padding: 0; display: grid; place-items: center; }
.prop .rd i { width: 11px; height: 11px; transform: rotate(45deg); background: linear-gradient(135deg, #cfd2d5, #7b8086); border: 1px solid #555; }
.prop .rd.Rare i { background: linear-gradient(135deg, #b9f3e0, #1f9c79); }
.prop .rd.Unique i { background: linear-gradient(135deg, #ffe08a, #e07b12); }
.prop .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; font-size: 13px; }
.prop .x { border: 0; border-left: 1px solid #c9c9c9; background: transparent; font-size: 12px; }
.props .plus { width: 100%; border: 0; padding: 6px; background: linear-gradient(#f3f3f3, #e2e2e2); }
.idesc { font-size: 13px; margin: 0; line-height: 1.4; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions button, .btn { border: 1px solid #999; background: linear-gradient(#fff, #e6e6e6); padding: 5px 10px; }

.actions select { border: 1px solid #999; padding: 4px; background: #fff; }

/* enchantment slots: drawn to look like the in-game enchanting diamonds */
.slots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0; padding-top: 2px; }
.slot { --s: 104px; position: relative; width: var(--s); height: var(--s); flex: none; margin: 0 -2px; }
.diamond, .slot .frame, .slot .frame::after, .opt { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.slot .frame { position: absolute; inset: 0; background: linear-gradient(180deg, #b78cff, #7b3fd0 60%, #5a24ad); }
.slot .frame::after { content: ""; position: absolute; inset: 3px; background: linear-gradient(180deg, #0f0b17 0%, #1a1328 38%, #33195e 70%, #6a32c4 100%); }
.slot .top { position: absolute; left: 25%; top: 4%; width: 50%; height: 42%; display: grid; place-items: center; pointer-events: none; }
.slot .top svg { width: 46%; height: 46%; }
.slot .top b { position: absolute; bottom: 4%; font-size: 10px; color: #d9c2ff; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt { position: absolute; width: 50%; height: 50%; border: 0; padding: 0; background: transparent; display: block; }
.opt > svg, .opt > img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; }
.opt:focus-visible { outline: none; filter: brightness(1.25); }
.opt:hover { filter: brightness(1.12); }
.slot .p0 { left: 25%; top: 50%; } .slot .p1 { left: 50%; top: 25%; } .slot .p2 { left: 0; top: 25%; }
.slot.bought .opt { left: 6%; top: 6%; width: 88%; height: 88%; }
.slot.bought .opt > svg, .slot.bought .opt > img { inset: 8%; width: 84%; height: 84%; }
.opt .tiers { position: absolute; left: 0; right: 0; bottom: 15%; display: flex; justify-content: center; gap: 3px; }
.opt .tiers i { width: 8px; height: 8px; transform: rotate(45deg); background: #fff1a8; border: 1px solid #6b4a00; box-shadow: 0 0 4px #ffd84a; }
.slot.addslot .frame { background: #bdbdbd; }
.slot.addslot .frame::after { background: #f1f1f1; }
.slot.addslot button { position: absolute; inset: 0; border: 0; background: transparent; font-size: 26px; color: #777; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.slot.gild .frame { background: linear-gradient(180deg, #ffe58a, #c9930f); }
.slot.gild .frame::after { background: linear-gradient(180deg, #1a1408, #3a2a0b 60%, #8a6410); }
.slot.gild .opt { left: 12%; top: 12%; width: 76%; height: 76%; }
.gildrow { display: flex; align-items: center; gap: 10px; }
.gildrow .slot { --s: 76px; margin: 0; }
.gameimg { object-fit: contain; }
.tile img.item { width: 86%; height: 86%; }
.plist .mini img, .plist .mini svg { width: 26px; height: 26px; object-fit: contain; }
img.eimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.gfcount { font-variant-numeric: tabular-nums; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .35); display: grid; place-items: center;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.dialog { background: var(--win); border: 1px solid #888; box-shadow: 0 6px 30px rgb(0 0 0 / .35); width: min(860px, 100%); height: min(560px, 100%); display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); min-height: 0; }
.dialog.small { width: min(440px, 100%); height: auto; max-height: 100%; display: block; overflow: auto; }
.picker { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-right: 1px solid #ccc; min-height: 0; }
.picker header { background: var(--title); color: #fff; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.picker header button, .closex { border: 0; background: #c94a3a; color: #fff; width: 22px; height: 20px; font-size: 12px; padding: 0; }
.picker input { border: 0; border-bottom: 1px solid #ccc; padding: 8px 10px; }
.plist { overflow: auto; min-height: 0; }
.plist .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 3px; background: #fafafa; position: sticky; top: 0;  z-index: 3; }
.plist button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid #f0f0f0; background: #fff; padding: 7px 10px; text-align: left; }
.plist button:hover, .plist button.cur { background: #ffe1c4; }
.plist .mini { width: 26px; height: 26px; flex: none; position: relative; }
.plist .mini .d { position: absolute; inset: 4px; transform: rotate(45deg); background: var(--ec, #888); border: 1px solid rgb(0 0 0 / .4); }
.plist .mini svg { width: 26px; height: 26px; }
.plist .tag { margin-left: auto; font-size: 10px; color: var(--purple); border: 1px solid currentColor; padding: 0 4px; }
.pdetail { position: relative; padding: 36px 18px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr auto; gap: 8px 16px; min-height: 0; overflow: auto; }
.pdetail .closex { position: absolute; right: 8px; top: 8px; z-index: 3; width: 30px; height: 24px; }
.pdetail .rk { font-size: 12px; color: var(--muted); }

.plist .mini { position: relative; }
.plist button { position: relative; z-index: 1; }
.plist .mini svg, .plist .mini img { position: absolute; inset: 0; }
.pdetail .tierrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.pdetail .tierrow .stepper input { width: 40px; font-size: 20px; }
.pdetail .cost { display: flex; align-items: center; gap: 6px; font-size: 18px; }
.pdetail .cost svg { width: 22px; height: 22px; }
.badge { display: inline-block; font-size: 11px; color: #fff; background: var(--purple); padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.small header { background: var(--title); color: #fff; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
.small .body { padding: 14px; display: grid; gap: 10px; }
.small label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.small input, .small textarea { border: 1px solid #aaa; padding: 7px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--ink); }
.small p { margin: 0; line-height: 1.45; }

/* stats + json tabs */
.page { height: 100%; overflow: auto; padding: 12px max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; align-items: center; border-bottom: 1px solid #eee; padding: 3px 0; }
.stat span { overflow-wrap: anywhere; font-size: 13px; }
.stat input { border: 1px solid #aaa; padding: 3px 6px; font-variant-numeric: tabular-nums; width: 100%; }
.page h2 { font-size: 15px; margin: 14px 0 8px; font-weight: 600; }
.page h2:first-child { margin-top: 0; }
textarea.raw { width: 100%; height: calc(100% - 46px); min-height: 240px; border: 1px solid #aaa; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre; padding: 8px; resize: none; }

/* portrait */
.rotate { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .cols { grid-template-columns: 1fr; height: auto; }
  .col { overflow: visible; border-right: 0 !important; border-bottom: 1px solid #eee; }
  .col.left { grid-template-columns: 1fr 120px; grid-template-rows: auto auto; }

<script>
// ---- AES-256 ECB, zero padding (matches .NET AesManaged ECB/PaddingMode.Zeros) ----
const AES = (() => {
  const S = new Uint8Array(256), SI = new Uint8Array(256);
  const xt = (a) => ((a << 1) ^ (a & 0x80 ? 0x1b : 0)) & 0xff;
  const mul = (a, b) => { let r = 0; while (b) { if (b & 1) r ^= a; a = xt(a); b >>= 1; } return r; };
  // build S-box from GF(2^8) inverse + affine transform
  for (let i = 0; i < 256; i++) {
    let inv = 0;

function openTypePicker(it) {
  let q = "";

  const pick = (t) => {
    it.type = t; const cat = categoryOf(t);

    if (/_Unique\d*$/i.test(t)) it.rarity = "Unique"; else if (it.rarity === "Unique") it.rarity = "Common";
    if (cat === "armor" && !Array.isArray(it.armorproperties)) it.armorproperties = [];
    if (cat !== "artifact" && !it.enchantments) it.enchantments = unset3();
    if (it.equipmentSlot && !(SLOT_OF[cat] || []).includes(it.equipmentSlot)) { delete it.equipmentSlot; it.inventoryIndex = nextIndex(); }
    reorderKeys(it); touch(); closeLayer(); later(renderPane);
  };
  const draw = () => {
    const types = knownTypes().filter((t) => !q || (itemName(t) + " " + t).toLowerCase().includes(q)).sort((a, b) => itemName(a).localeCompare(itemName(b)));

/* ---------- menus ---------- */
function menu(rootId, items) {
  const root = $(rootId), btn = root.querySelector("button");
  const close = () => { root.classList.remove("open"); const d = root.querySelector(".dropdown"); if (d) d.remove(); };
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = root.classList.contains("open");
    document.querySelectorAll(".menu.open").forEach((m) => { m.classList.remove("open"); m.querySelector(".dropdown")?.remove(); });
    if (wasOpen) return;
    root.classList.add("open");
    root.append(h("div", { class: "dropdown", role: "menu" }, items().map((it) => it === "-" ? h("hr") :
      h("button", { type: "button", role: "menuitem", onclick: () => { close(); it[1](); } }, it[0], it[2] ? h("span", { class: "kbd" }, it[2]) : null))));
  });
  document.addEventListener("click", (e) => { if (!root.contains(e.target)) close(); });
}

:root {
  --g-bg: #2a1416; --g-ink: #f4efe9; --g-dim: #b9aaa3; --g-line: #4a3536;
  --g-slot: #241a1c; --g-slot-x: #3b2e30; --g-frame: #121012; --g-bevel: #6b6470;
  --g-unique: #f08a1f; --g-rare: #3cc796; --g-common: #8c8178;
  --g-purple: #8f4ff0; --g-pink: #ff4fa0; --g-gold: #f5c542;
  --g-px: "MCD Digits", "Pixelify Sans", "Courier New", monospace;
  --g-ui: "Noto Sans", "Segoe UI", Roboto, sans-serif;
}
#app { display: none !important; }
html, body { background: #120809; }
#game { position: fixed; inset: 0; overflow: hidden; background: #160a0b; color: var(--g-ink); font-family: var(--g-ui); user-select: none; -webkit-user-select: none; }
#game canvas.bgc { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#game .vign { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 10%, transparent 30%, rgb(10 3 4 / .55) 75%, rgb(5 1 2 / .85)); pointer-events: none; }
.stage { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; transform-origin: 0 0; }
.stage button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.stage button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.px { font-family: var(--g-px); font-weight: 700; letter-spacing: .02em; text-shadow: 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000, 2px 2px 0 #000; }
.abs { position: absolute; }
.stage .px { font-family: var(--g-px); font-weight: 700; }

/* currencies */
.g-cur { left: 30px; top: 24px; display: flex; align-items: center; gap: 22px; }
.g-cur button { display: flex; align-items: center; gap: 8px; font-size: 27px; }
.g-cur svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 0 #000); }

/* tiles: beveled dark frame, rarity border, diagonal rarity colour with a pixel-block corner (gold when gilded) */
.gt { position: absolute; width: 78px; height: 78px; }
.gt .fr { position: absolute; inset: 0; background: linear-gradient(145deg, #57514f, #2a2627 45%, #141113); box-shadow: inset 0 0 0 1px #0b0a0b, inset 2px 2px 0 rgb(255 255 255 / .14), 0 3px 0 rgb(0 0 0 / .65); }

.gt .pw svg { width: 12px; height: 12px; filter: drop-shadow(0 1px 0 #000); }

.gt.empty .in::before, .gt.empty .in::after { content: ""; position: absolute; left: 50%; top: -20%; width: 2px; height: 140%; background: #34292b; transform: rotate(45deg); }

addEventListener("pointerdown", () => padMode(false), true);
// keep the D-pad cursor in place when the screen redraws
const _renderStageOrig = renderStage;
renderStage = function () {
  const root = $("game"), cur = document.activeElement;
  const idx = PAD.on && cur && root.contains(cur) ? focusables(root).indexOf(cur) : -1;
  _renderStageOrig();
  if (idx >= 0 && !$("layer").lastElementChild && !G.sheet) { const list = focusables(root); const el = list[Math.min(idx, list.length - 1)]; if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: "nearest" }); } }
};
const _fillEditOrig = fillEditSheet;
fillEditSheet = function () {
  const body = G.sheet && G.sheet.el.querySelector(".body"), cur = document.activeElement;
  const idx = PAD.on && body && body.contains(cur) ? focusables(body).indexOf(cur) : -1;
  _fillEditOrig();
  if (idx >= 0 && G.sheet) { const list = focusables(G.sheet.el.querySelector(".body")); const el = list[Math.min(idx, list.length - 1)]; if (el) el.focus({ preventScroll: true }); }
};
// when a dialog or sheet opens while using the controller, put the cursor in it
new MutationObserver(() => { if (PAD.on) later(() => { const root = scope(); if (!root.contains(document.activeElement) || document.activeElement === document.body) startFocus(root); }); })
  .observe(document.body, { childList: true, subtree: false });
new MutationObserver(() => { if (PAD.on) later(() => { const root = scope(); if (!root.contains(document.activeElement)) startFocus(root); }); })
  .observe($("layer"), { childList: true });

</script>
